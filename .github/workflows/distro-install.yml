name: Distribution Install

on:
  pull_request:
  push:
    branches:
      - main
      - integration
  schedule:
    - cron: '50 12 * * 1-5'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate-matrix:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
    - uses: actions/checkout@v7
    - name: Generate matrix
      id: generate-matrix
      run: |
        tests="$(ruby boxes.rb | jq -c -r '. | keys')"
        echo "matrix=${tests}" >> ${GITHUB_OUTPUT}

  verify-install:
    needs: generate-matrix
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    env:
      VAGRANT_DEFAULT_PROVIDER: docker
      VAGRANT_LIBVIRT_DRIVER: qemu
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive
    - name: Disable apparmor to allow containers use alternative paths
      run: |
        sudo systemctl stop apparmor
        sudo apparmor_parser --remove /etc/apparmor.d/unix-chkpwd
    - name: Install Vagrant
      run: |
        curl --fail --silent --show-error https://apt.releases.hashicorp.com/gpg | \
          sudo tee /usr/share/keyrings/hashicorp.asc > /dev/null
        sudo tee /etc/apt/sources.list.d/hashicorp.sources <<EOF
        Types: deb
        URIs: https://apt.releases.hashicorp.com
        Suites: $(. /etc/os-release; echo ${VERSION_CODENAME})
        Components: main
        Signed-By: /usr/share/keyrings/hashicorp.asc
        EOF
        sudo apt-get update
        sudo apt-get install -y vagrant
    - uses: actions/cache@v6
      with:
        path: ~/.vagrant.d/boxes
        key: ${{ runner.os }}-${{ matrix.distro }}
        restore-keys: |
          ${{ runner.os }}-
    - name: launch target distro
      run: |
        vagrant up --no-provision ${{ matrix.distro }}

    - name: test vagrant-libvirt in target distro
      run: |
        export QA_VAGRANT_LIBVIRT_VERSION=git-$(git submodule status -- vagrant-libvirt | cut -d' ' -f2)
        export QA_VAGRANT_LIBVIRT_REPO=$(git -C vagrant-libvirt remote get-url origin)
        vagrant provision ${{ matrix.distro }}

    - name: show target distro state on failure
      if: failure()
      run: |
        set +e
        id=$(cat .vagrant/machines/${{ matrix.distro }}/docker/id) || exit 0
        docker ps --all --filter id=${id}
        docker logs ${id} 2>&1 | tail -n 100
        docker exec ${id} systemctl --failed --no-pager
        docker exec ${id} journalctl --boot --no-pager --lines 300

  verify-install-libvirt:
    needs: generate-matrix
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
          sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Set up libvirt
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          dnsmasq-base \
          libvirt-daemon-system \
          libvirt-dev \
          qemu-system-x86 \
          qemu-utils \
          ;
        # docker sets the policy of the FORWARD chain to DROP, which blocks
        # the outbound traffic of the VMs.
        sudo iptables -P FORWARD ACCEPT
        sudo usermod -a -G libvirt ${USER}
    - name: Install Vagrant
      run: |
        curl --fail --silent --show-error https://apt.releases.hashicorp.com/gpg | \
          sudo tee /usr/share/keyrings/hashicorp.asc > /dev/null
        sudo tee /etc/apt/sources.list.d/hashicorp.sources <<EOF
        Types: deb
        URIs: https://apt.releases.hashicorp.com
        Suites: $(. /etc/os-release; echo ${VERSION_CODENAME})
        Components: main
        Signed-By: /usr/share/keyrings/hashicorp.asc
        EOF
        sudo apt-get update
        sudo apt-get install -y vagrant
        vagrant plugin install vagrant-libvirt
    - name: Set up box cache key
      id: box-cache
      run: |
        # a cache hit is never saved again, so rotate the key monthly to pick
        # up updated boxes, and don't restore older ones.
        echo "month=$(date -u +%Y-%m)" >> ${GITHUB_OUTPUT}
    - uses: actions/cache@v6
      with:
        path: ~/.vagrant.d/boxes
        key: ${{ runner.os }}-libvirt-${{ matrix.distro }}-${{ hashFiles('boxes.rb') }}-${{ steps.box-cache.outputs.month }}
    - name: launch target distro
      run: |
        df -h /
        sg libvirt -c "vagrant up --no-provision ${{ matrix.distro }}"
    - name: test vagrant-libvirt in target distro
      run: |
        export QA_VAGRANT_LIBVIRT_VERSION=git-$(git submodule status -- vagrant-libvirt | cut -d' ' -f2)
        export QA_VAGRANT_LIBVIRT_REPO=$(git -C vagrant-libvirt remote get-url origin)
        sg libvirt -c "vagrant provision ${{ matrix.distro }}"
        df -h /

    - name: show target distro state on failure
      if: failure()
      run: |
        set +e
        df -h /
        sudo virsh list --all
        sudo journalctl --unit libvirtd --no-pager --lines 100
        sg libvirt -c "vagrant ssh ${{ matrix.distro }} -c '
          find ~/.vagrant.d/gems -name mkmf.log -exec tail -n 100 {} +;
          sudo systemctl --failed --no-pager;
          sudo journalctl --boot --no-pager --lines 300'"

  finish:
    needs:
      - verify-install
      - verify-install-libvirt
    runs-on: ubuntu-26.04
    steps:
    - name: Matrix finished
      run: |
        echo "success"
